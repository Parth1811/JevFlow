<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">Jevflow</title>
  <desc id="d">Jevflow banner: a branching phase DAG where tests are blocked and a debug branch waits on failure.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfbff"/><stop offset="0.55" stop-color="#f1f2ff"/><stop offset="1" stop-color="#eafaf4"/></linearGradient>
    <radialGradient id="glowA" cx="0.18" cy="0.2" r="0.55"><stop offset="0" stop-color="#6d5dfc" stop-opacity="0.18"/><stop offset="1" stop-color="#6d5dfc" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB" cx="0.9" cy="0.95" r="0.6"><stop offset="0" stop-color="#20d6a4" stop-opacity="0.18"/><stop offset="1" stop-color="#20d6a4" stop-opacity="0"/></radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1b1140"/><stop offset="0.6" stop-color="#4b3fd0"/><stop offset="1" stop-color="#0f9f7a"/></linearGradient>
    <linearGradient id="flow" gradientUnits="userSpaceOnUse" x1="780" y1="0" x2="1210" y2="0"><stop offset="0" stop-color="#6d5dfc"/><stop offset="1" stop-color="#20d6a4"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1b1140" stroke-opacity="0.05" stroke-width="1"/></pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6d5dfc"/></marker>
  </defs>
  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <rect width="1280" height="400" fill="url(#glowA)"/>
  <rect width="1280" height="400" fill="url(#glowB)"/>
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="80" y="150" font-size="92" font-weight="800" letter-spacing="-3" fill="url(#word)">Jevflow</text>
    <text x="84" y="196" font-size="23" font-weight="600" fill="#1b1b3a">Your coding agent says “done”. Jevflow checks.</text>
    <text x="84" y="230" font-size="17" fill="#5a6280">Phase-by-phase guardrails for Claude Code.</text>
    <text x="84" y="254" font-size="17" fill="#5a6280">Judged by Jev, decided by code.</text>
    <g font-size="14" font-weight="600">
      <rect x="84" y="282" width="150" height="30" rx="15" fill="#4b3fd0" fill-opacity="0.06" stroke="#4b3fd0" stroke-opacity="0.25"/>
      <text x="159" y="302" text-anchor="middle" fill="#4b3fd0">Claude Code plugin</text>
      <rect x="244" y="282" width="118" height="30" rx="15" fill="#4b3fd0" fill-opacity="0.06" stroke="#4b3fd0" stroke-opacity="0.25"/>
      <text x="303" y="302" text-anchor="middle" fill="#4b3fd0">stdlib only</text>
      <rect x="372" y="282" width="136" height="30" rx="15" fill="#4b3fd0" fill-opacity="0.06" stroke="#4b3fd0" stroke-opacity="0.25"/>
      <text x="440" y="302" text-anchor="middle" fill="#4b3fd0">auto-restart</text>
    </g>
  </g>
  <g font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace">
    <path d="M790 205 C 830 205, 840 140, 890 140" fill="none" stroke="url(#flow)" stroke-width="3" opacity="0.85"/><path d="M790 205 C 830 205, 840 270, 890 270" fill="none" stroke="url(#flow)" stroke-width="3" opacity="0.85"/><path d="M890 140 H 1000" fill="none" stroke="url(#flow)" stroke-width="3" opacity="0.85"/><path d="M890 270 C 950 270, 950 140, 1000 140" fill="none" stroke="url(#flow)" stroke-width="3" opacity="0.85"/><path d="M1000 140 C 1060 140, 1060 270, 1100 270" fill="none" stroke="#e5485d" stroke-width="2" stroke-dasharray="6 5" opacity="0.8"/><path d="M1000 140 C 1110 140, 1150 205, 1200 205" fill="none" stroke="#1b1140" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="4 5"/><path d="M1100 270 C 1150 270, 1160 205, 1200 205" fill="none" stroke="#1b1140" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="4 5"/>
    <g transform="translate(790 205)"><circle r="26" fill="#ffffff" stroke="#10a37f" stroke-width="2.5"/><circle r="26" fill="#10a37f" fill-opacity="0.16"/><path d="M-10 1 l6 6 l14 -15" fill="none" stroke="#0c8a6a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text y="46" text-anchor="middle" font-size="13" fill="#3a4266">scaffold</text></g><g transform="translate(890 140)"><circle r="26" fill="#ffffff" stroke="#10a37f" stroke-width="2.5"/><circle r="26" fill="#10a37f" fill-opacity="0.16"/><path d="M-10 1 l6 6 l14 -15" fill="none" stroke="#0c8a6a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text y="46" text-anchor="middle" font-size="13" fill="#3a4266">implement</text></g><g transform="translate(890 270)"><circle r="26" fill="#ffffff" stroke="#10a37f" stroke-width="2.5"/><circle r="26" fill="#10a37f" fill-opacity="0.16"/><path d="M-10 1 l6 6 l14 -15" fill="none" stroke="#0c8a6a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text y="46" text-anchor="middle" font-size="13" fill="#3a4266">docs</text><rect x="-40" y="-66" width="80" height="24" rx="7" fill="#10a37f" fill-opacity="0.16" stroke="#10a37f" stroke-opacity="0.7"/><text y="-49" text-anchor="middle" font-size="11" font-weight="700" fill="#0c7a5e">ADVANCE</text></g><g transform="translate(1000 140)">
      <circle r="38" fill="#e5485d" fill-opacity="0.12" filter="url(#soft)"/>
      <circle r="26" fill="#ffffff" stroke="#e5485d" stroke-width="2.5"/>
      <circle r="26" fill="#e5485d" fill-opacity="0.14"/>
      <path d="M-8 -8 L8 8 M8 -8 L-8 8" stroke="#d03a4f" stroke-width="3.5" stroke-linecap="round"/>
      <text y="46" text-anchor="middle" font-size="13" fill="#3a4266">test</text>
      <rect x="-34" y="-66" width="68" height="24" rx="7" fill="#e5485d" fill-opacity="0.18" stroke="#e5485d" stroke-opacity="0.7"/>
      <text y="-49" text-anchor="middle" font-size="11" font-weight="700" fill="#b42a3e">BLOCK</text>
      <path d="M-20 -24 C -46 -44, 46 -44, 20 -24" fill="none" stroke="#6d5dfc" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
    </g><g transform="translate(1100 270)">
      <circle r="22" fill="#ffffff" stroke="#e5485d" stroke-opacity="0.8" stroke-width="2" stroke-dasharray="4 4"/>
      <circle cx="-2" cy="-2" r="7" fill="none" stroke="#e5485d" stroke-width="2.5"/><path d="M3 3 L9 9" stroke="#e5485d" stroke-width="3" stroke-linecap="round"/>
      <text y="42" text-anchor="middle" font-size="13" fill="#3a4266">debug</text>
      <text y="-30" text-anchor="middle" font-size="11" fill="#e5485d" opacity="0.9">on_fail</text>
    </g><g transform="translate(1200 205)">
      <rect x="-26" y="-26" width="52" height="52" rx="13" fill="#ffffff" stroke="#1b1140" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="4 4"/>
      <path d="M0 -12 L3.5 -3.9 L12.3 -3.8 L5.5 1.8 L7.9 10.4 L0 5.6 L-7.9 10.4 L-5.5 1.8 L-12.3 -3.8 L-3.5 -3.9 Z" fill="#4b3fd0" fill-opacity="0.85"/>
      <text y="46" text-anchor="middle" font-size="13" fill="#3a4266">release</text>
    </g>
    <text x="995" y="365" text-anchor="middle" font-size="13" fill="#6b7394">claims_done 0.92   phase_done 0.02   check FAIL   -&gt; keep going</text>
  </g>
</svg>
